name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check jury scripts tests
      - run: uv run ruff format --check jury scripts tests
      - run: uv run pytest -q
      - name: Bench template is valid YAML with both judges
        run: uv run python -c "import yaml; d=yaml.safe_load(open('templates/jury-bench.template.yaml')); assert {a['name'] for a in d['agents']} == {'jury-inspector','jury-critic'}"
