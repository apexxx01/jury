<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jury · Judging Floor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f2ea; --panel:#fffdf8; --ink:#1d1a16; --muted:#6f675c; --line:#e4dccd;
  --brass:#a86a12; --brass-soft:#f3e3c4; --good:#2f7d4f; --good-soft:#dcefe2;
  --warn:#9a6a00; --warn-soft:#f6ecd0; --bad:#a83a32; --bad-soft:#f5dcd8; --track:#ece5d8;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f0e0c; --panel:#17150f; --ink:#f1ebdf; --muted:#a39a8a; --line:#2b2720;
  --brass:#e0a63e; --brass-soft:#3a2c12; --good:#5ec48a; --good-soft:#15301f;
  --warn:#e6b54a; --warn-soft:#352a10; --bad:#ee7a6f; --bad-soft:#3a1916; --track:#26221b;
}}
:root[data-theme="dark"]{
  --bg:#0f0e0c; --panel:#17150f; --ink:#f1ebdf; --muted:#a39a8a; --line:#2b2720;
  --brass:#e0a63e; --brass-soft:#3a2c12; --good:#5ec48a; --good-soft:#15301f;
  --warn:#e6b54a; --warn-soft:#352a10; --bad:#ee7a6f; --bad-soft:#3a1916; --track:#26221b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:28px 16px 64px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:20px}
.eyebrow{font:500 12px/1 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
h1{font:700 clamp(30px,5vw,44px)/1.05 Fraunces,Georgia,serif;margin:8px 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:92px}
.stat b{display:block;font:700 22px/1.1 Fraunces,serif}
.stat span{font-size:12px;color:var(--muted);text-transform:capitalize}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:18px 0 8px;color:var(--muted);font-size:13px}
.legend i{font-style:normal;color:var(--ink);font-weight:600}
.cases{display:grid;gap:12px;margin-top:12px}
.case{display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.rank{font:700 28px/1 Fraunces,serif;color:var(--muted);text-align:center;padding-top:4px}
.case.top .rank{color:var(--brass)}
.title{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px}
.title a{color:var(--ink);font-weight:600;font-size:16px;text-decoration:none;word-break:break-all}
.title a:hover{text-decoration:underline}
.num{font:500 12px 'JetBrains Mono',monospace;color:var(--muted)}
.meta{color:var(--muted);font-size:13px;margin:2px 0 10px}
.crit{display:grid;grid-template-columns:minmax(120px,170px) 1fr 40px;gap:10px;align-items:center;font-size:13px;margin:4px 0}
.track{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--brass);transition:width .6s ease}
.crit .v{font:500 12px 'JetBrains Mono',monospace;text-align:right}
.appeal{color:var(--warn);font-weight:600}
details{margin-top:12px;font-size:14px;color:var(--muted)}
details summary{cursor:pointer;color:var(--ink);font-weight:500;width:max-content}
details p{margin:8px 0 0;line-height:1.45}
details b{color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:12px;margin-right:6px}
.flags{margin:10px 0 0;padding:0;list-style:none;font-size:13px}
.flags li{color:var(--bad);margin:2px 0}
.flags li::before{content:"⚑ ";}
.judges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font:500 11px 'JetBrains Mono',monospace;border:1px solid var(--line);border-radius:99px;padding:3px 8px;color:var(--muted)}
.chip.done{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.side{text-align:right;min-width:110px}
.score{font:700 34px/1 Fraunces,serif}
.score small{font:500 13px Inter,sans-serif;color:var(--muted)}
.pill{display:inline-block;margin-top:8px;font:600 11px/1 Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:6px 9px;border-radius:6px}
.p-open{background:var(--track);color:var(--muted)}
.p-scored{background:var(--warn-soft);color:var(--warn)}
.p-good{background:var(--good-soft);color:var(--good)}
.p-mid{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.note{font-size:12px;color:var(--muted);margin-top:6px;max-width:220px;margin-left:auto}
.empty{border:1px dashed var(--line);border-radius:14px;padding:40px 20px;text-align:center;color:var(--muted)}
.empty code{font-family:'JetBrains Mono',monospace;color:var(--ink)}
footer{margin-top:28px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (max-width:640px){
  .case{grid-template-columns:1fr;gap:8px}
  .rank{text-align:left}
  .side{text-align:left}
  .note{margin-left:0}
  .crit{grid-template-columns:110px 1fr 34px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Jury · judging floor</div>
      <h1 id="rubric">Leaderboard</h1>
      <p class="sub">Every submission gets a room. Agents gather evidence, a human decides.</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="legend" id="legend"></div>
  <div class="cases" id="cases"></div>
  <footer><span class="live" id="updated">connecting…</span><span>Powered by Switch rooms · Clerk · Auditor · Inspector · Critic</span></footer>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function pillFor(c, verdicts){
  if (c.verdict){
    const i = verdicts.indexOf(c.verdict.decision);
    const cls = i === 0 ? "p-good" : (i === verdicts.length - 1 ? "p-bad" : "p-mid");
    return `<span class="pill ${cls}">${esc(c.verdict.decision)}</span>`;
  }
  if (c.status === "scored") return `<span class="pill p-scored">awaiting verdict</span>`;
  return `<span class="pill p-open">${c.complete ? "being judged" : "panel incomplete"}</span>`;
}
function means(c){
  const sums = {};
  for (const card of Object.values(c.scorecards || {})) for (const [k, v] of Object.entries(card.scores || {})) (sums[k] ||= []).push(v);
  const out = {}; for (const [k, v] of Object.entries(sums)) out[k] = v.reduce((a, b) => a + b, 0) / v.length; return out;
}
function render(s){
  $("rubric").textContent = s.rubric.name;
  const cs = s.cases, decided = cs.filter(c => c.verdict).length;
  const top = cs.filter(c => c.verdict && c.verdict.decision === s.rubric.verdicts[0]).length;
  const passes = cs.map(c => c.first_pass_s).filter(v => v != null).sort((a, b) => a - b);
  const med = passes.length ? passes[Math.floor(passes.length / 2)] : null;
  const fmt = (t) => t == null ? "–" : (t >= 60 ? `${Math.floor(t / 60)}m ${String(t % 60).padStart(2, "0")}s` : `${t}s`);
  $("stats").innerHTML = [["Cases", cs.length], ["Decided", decided], [s.rubric.verdicts[0], top], ["Median first pass", fmt(med)]]
    .map(([k, v]) => `<div class="stat"><b>${v}</b><span>${esc(k)}</span></div>`).join("");
  $("legend").innerHTML = s.rubric.criteria.map(c => `<span><i>${c.weight}%</i> ${esc(c.label)}</span>`).join("");
  if (!cs.length){
    $("cases").innerHTML = `<div class="empty">The floor is empty. Paste a GitHub link in <code>#${esc(s.rooms.intake)}</code> to open the first case.</div>`;
  } else {
    $("cases").innerHTML = cs.map(c => {
      const m = means(c);
      const crit = s.rubric.criteria.map(k => {
        const v = m[k.id];
        return `<div class="crit"><span>${esc(k.label)}</span><div class="track"><div class="fill" style="width:${v == null ? 0 : v * 10}%"></div></div><span class="v">${v == null ? "–" : v.toFixed(1)}</span></div>`;
      }).join("");
      const flags = (c.red_flags || []).slice(0, 4).map(f => `<li>${esc(f)}</li>`).join("");
      const notes = Object.entries(c.scorecards || {}).map(([j, card]) => {
        const text = card.summary || Object.values(card.notes || {}).join("; ");
        return text ? `<p><b>${esc(j)}</b> ${esc(text)}</p>` : "";
      }).join("");
      const judges = (c.judges || []).map(j => `<span class="chip ${c.scorecards && c.scorecards[j] ? "done" : ""}">${esc(j)}</span>`).join("");
      const score = c.final == null ? "–" : (+c.final).toFixed(0);
      const note = c.verdict && c.verdict.note ? `<div class="note">“${esc(c.verdict.note)}” · ${esc(c.verdict.judge)}</div>` : "";
      return `<article class="case ${c.rank <= 3 && c.final != null ? "top" : ""}">
        <div class="rank">${c.rank}</div>
        <div>
          <div class="title"><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.owner)}/${esc(c.repo)}</a><span class="num">${esc(c.label)}${c.room_name ? " · #" + esc(c.room_name) : ""}</span></div>
          <div class="meta">filed by ${esc(c.submitter)}${c.assignee ? ` · with @${esc(c.assignee)}` : ""}${c.first_pass_s != null ? ` · first pass ${fmt(c.first_pass_s)}` : ""}${c.appeals ? ` · <span class="appeal">appealed${c.appeals > 1 ? " ×" + c.appeals : ""}</span>` : ""}</div>
          ${crit}
          ${flags ? `<ul class="flags">${flags}</ul>` : ""}
          <div class="judges">${judges}</div>
          ${notes ? `<details data-case="${c.number}" ${OPEN.has(String(c.number)) ? "open" : ""}><summary>Judges' notes</summary>${notes}</details>` : ""}
        </div>
        <div class="side"><div class="score">${score}<small>/100</small></div>${pillFor(c, s.rubric.verdicts)}${note}</div>
      </article>`;
    }).join("");
  }
  $("updated").textContent = "live · updated " + new Date(s.generated_at * 1000).toLocaleTimeString();
}
const OPEN = new Set();
document.addEventListener("toggle", (e) => {
  const d = e.target; if (!(d instanceof HTMLDetailsElement) || !d.dataset.case) return;
  d.open ? OPEN.add(d.dataset.case) : OPEN.delete(d.dataset.case);
}, true);
async function tick(){
  try { const r = await fetch("/api/state", {cache: "no-store"}); render(await r.json()); }
  catch (e) { $("updated").textContent = "reconnecting…"; }
}
tick(); setInterval(tick, 3000);
</script>
</body>
</html>
